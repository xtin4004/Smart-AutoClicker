name: Build Korean APK

on:
  workflow_dispatch:
  push:
    branches: [ claude/korean-localization ]

jobs:
  build:
    name: Build Klick'r (Korean, F-Droid debug)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set NDK
        shell: bash
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build APK
        run: ./gradlew -PabiFilters=arm64-v8a :smartautoclicker:assembleFDroidDebug
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klickr-korean-apk
          path: smartautoclicker/build/outputs/apk/fDroid/debug/*arm64-v8a*.apk
          if-no-files-found: error
